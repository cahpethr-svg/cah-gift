<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwixVC8r8-ihKMQt5IDSCRTEc2pFmPFxIKs6hLVJG5ite84J03DDRk1eC2QC7cO76WL/exec";
    const lineAccountID = "707nyqrq";
    let isProcessing = false;

    // โหมดเทส (กดซ้ำได้)
    function hasPlayed() {
      return false; 
    }
    
    function setPlayedFlag() {
      // โหมดเทสยังไม่บันทึก
    }

    function makeAmbientBlood() {
      const layer = document.getElementById('ambientBlood');
      if (!layer) return;
      for (let i = 0; i < 18; i++) {
        const drop = document.createElement('span');
        drop.className = 'ambient-blood';
        drop.style.left = (Math.random() * 100) + 'vw';
        drop.style.height = (12 + Math.random() * 35) + 'px';
        drop.style.animationDuration = (7 + Math.random() * 13) + 's';
        drop.style.animationDelay = (-Math.random() * 18) + 's';
        drop.style.opacity = (0.12 + Math.random() * 0.35).toFixed(2);
        layer.appendChild(drop);
      }
    }

    function makeSplatter() {
      const layer = document.getElementById('splatterLayer');
      if (!layer) return;
      layer.innerHTML = '';
      for (let i = 0; i < 62; i++) {
        const drop = document.createElement('span');
        drop.className = 'splat';
        const angle = Math.random() * Math.PI * 2;
        const distance = 18 + Math.random() * 85;
        drop.style.setProperty('--x', (42 + Math.random() * 16) + 'vw');
        drop.style.setProperty('--y', (42 + Math.random() * 16) + 'vh');
        drop.style.setProperty('--dx', (Math.cos(angle) * distance) + 'vw');
        drop.style.setProperty('--dy', (Math.sin(angle) * distance) + 'vh');
        drop.style.setProperty('--size', (5 + Math.random() * 23) + 'px');
        drop.style.setProperty('--rot', (Math.random() * 360) + 'deg');
        drop.style.animationDelay = (Math.random() * .17) + 's';
        layer.appendChild(drop);
      }
    }

    function playTerrifyingHorrorSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(95, now);
        subOsc.frequency.exponentialRampToValueAtTime(28, now + 1.1);
        subGain.gain.setValueAtTime(0.22, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        subOsc.connect(subGain); subGain.connect(ctx.destination);
        subOsc.start(now); subOsc.stop(now + 1.2);

        const scrape = ctx.createOscillator();
        const scrapeGain = ctx.createGain();
        scrape.type = 'triangle';
        scrape.frequency.setValueAtTime(620, now);
        scrape.frequency.linearRampToValueAtTime(1050, now + .22);
        scrape.frequency.exponentialRampToValueAtTime(170, now + .95);
        scrapeGain.gain.setValueAtTime(0.09, now);
        scrapeGain.gain.exponentialRampToValueAtTime(0.001, now + 1);
        scrape.connect(scrapeGain); scrapeGain.connect(ctx.destination);
        scrape.start(now); scrape.stop(now + 1.02);
        setTimeout(() => ctx.close().catch(() => {}), 1500);
      } catch (err) { }
    }

    function showBloodBurst() {
      const flash = document.getElementById('bloodFlash');
      const layer = document.getElementById('splatterLayer');
      if (flash) {
        flash.classList.remove('flash-active');
        void flash.offsetWidth;
        flash.classList.add('flash-active');
      }
      if (layer) {
        layer.classList.remove('active');
        void layer.offsetWidth;
        layer.classList.add('active');
        setTimeout(() => layer.classList.remove('active'), 1900);
      }
    }

    window.addEventListener('load', () => {
      makeAmbientBlood();
      makeSplatter();
      if (hasPlayed()) {
        const scene = document.getElementById('scene');
        if (scene) scene.classList.add('used');
        const hint = document.getElementById('statusHint');
        if (hint) hint.innerText = '🚫 สิทธิ์ของเครื่องนี้ถูกใช้ไปแล้ว';
        const prompt = document.querySelector('.open-prompt');
        if (prompt) prompt.innerText = 'FILE ALREADY ACCESSED';
      }
    });

    const giftBoxEl = document.getElementById('giftBox');
    if (giftBoxEl) {
      giftBoxEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          handleBoxClick();
        }
      });
    }

    async function handleBoxClick() {
      if (hasPlayed()) {
        alert('คุณได้เปิดแฟ้มคดีของเครื่องนี้ไปแล้วค่ะ (จำกัด 1 เครื่อง / 1 สิทธิ์)');
        return;
      }
      if (isProcessing) return;
      isProcessing = true;

      const stage = document.getElementById('giftBox');
      const scene = document.getElementById('scene');
      const hint = document.getElementById('statusHint');
      if (hint) hint.innerText = 'กำลังเปิดผนึกแฟ้มคดี...';
      
      if (stage) {
        stage.setAttribute('aria-disabled', 'true');
        stage.classList.add('shake');
      }
      if (scene) scene.classList.add('opening');
      playTerrifyingHorrorSound();

      try {
        const response = await fetch(GAS_API_URL, { method: 'GET', cache: 'no-store' });
        if (!response.ok) throw new Error('Network response was not OK');
        const result = await response.json();

        if (result.status === 'SUCCESS') {
          showBloodBurst();
          setPlayedFlag();
          document.getElementById('prizeDisplay').innerText = result.prize;

          // ส่งข้อความยืนยันผ่าน LINE Scheme มาตรฐาน (เปิดแอป LINE แน่นอน ไม่เออเร่อ)
          const msg = encodeURIComponent(`สวัสดีค่ะ/ครับ ฉันเปิดแฟ้มได้รางวัล "${result.prize}" (เวลา ${result.time}) ขอรับสิทธิ์ค่ะ/ครับ`);
          document.getElementById('lineSendBtn').href = `https://line.me/R/msg/text/?${msg}`;

          setTimeout(() => {
            document.getElementById('popupSuccess').style.display = 'flex';
          }, 1050);
        } else {
          showBloodBurst();
          setTimeout(() => {
            document.getElementById('popupEmpty').style.display = 'flex';
          }, 850);
        }
      } catch (err) {
        console.error(err);
        if (scene) scene.classList.remove('opening');
        if (stage) {
          stage.classList.remove('shake');
          stage.removeAttribute('aria-disabled');
        }
        if (hint) hint.innerText = '⚠ สัญญาณขาดหาย — แตะเพื่อเปิดอีกครั้ง';
        alert('สัญญาณอินเทอร์เน็ตขัดข้อง กรุณาลองใหม่อีกครั้งค่ะ');
        isProcessing = false;
      }
    }
  </script>
