<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Prompt:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', -apple-system, sans-serif; }
    
    body { 
      background: radial-gradient(circle at 50% 50%, #1a0f0f 0%, #050101 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
      position: relative;
    }

    .spooky-container { 
      text-align: center; 
      cursor: pointer; 
      user-select: none; 
      position: relative;
      z-index: 10;
      padding: 20px;
    }

    /* รูปแฟ้มหมายเลข 27 */
    .folder-wrap {
      width: 260px;
      max-width: 80vw;
      margin: 0 auto;
      animation: spookyFloat 3s infinite ease-in-out;
      transition: transform 0.2s, filter 0.2s;
    }
    .folder-image {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), 0 0 20px rgba(138, 3, 3, 0.4);
    }
    .spooky-container:hover .folder-wrap {
      transform: scale(1.05) rotate(-2deg);
      filter: drop-shadow(0 0 25px rgba(200, 0, 0, 0.8));
    }

    @keyframes spookyFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
    }

    .spooky-hint { 
      margin-top: 25px; 
      background: #0f0202; 
      color: #ff5252; 
      font-size: 14px; 
      font-weight: 700; 
      padding: 8px 24px; 
      border-radius: 30px; 
      display: inline-block; 
      border: 1.5px solid #b71c1c;
      box-shadow: 0 0 18px rgba(220, 38, 38, 0.5); 
      letter-spacing: 0.5px;
    }

    /* เอฟเฟกต์หน้าจอวาบสีเลือดตอนเปิดแฟ้ม */
    .blood-flash {
      position: fixed; 
      inset: 0;
      background: rgba(180, 0, 0, 0.85);
      z-index: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }
    .flash-active { opacity: 1 !important; transition: opacity 0.05s; }
    .flash-fade { opacity: 0 !important; transition: opacity 1.5s ease-out; }

    /* ป๊อปอัปผลรางวัล */
    .popup-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.92); 
      backdrop-filter: blur(8px); 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .popup-card { 
      background: #0a0404; 
      border: 2px solid #8a0303; 
      border-radius: 12px; 
      padding: 26px 20px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center; 
      box-shadow: 0 0 50px rgba(180, 0, 0, 0.5) inset, 0 0 45px rgba(255, 0, 0, 0.4); 
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .popup-title {
      font-family: 'Nosifer', cursive;
      font-size: 16px;
      color: #ff0000;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .reward-box { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1.5px dashed #ff4500; 
      padding: 12px; 
      border-radius: 8px; 
      margin: 14px 0; 
    }
    .reward-name { 
      font-size: 17px; 
      font-weight: 700; 
      color: #fff; 
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .capture-note { 
      font-size: 12px; 
      color: #fca5a5; 
      font-weight: 600; 
      background: rgba(220, 38, 38, 0.25); 
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 7px; 
      border-radius: 6px; 
      margin-bottom: 14px; 
    }
    .popup-card p { 
      font-size: 13px; 
      color: #cbd5e1; 
      margin-bottom: 16px; 
    }
    .line-claim-btn { 
      display: block; 
      background: #8a0303; 
      color: #fff; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 700; 
      padding: 11px 18px; 
      border-radius: 6px; 
      box-shadow: 0 0 15px rgba(138, 3, 3, 0.8); 
      transition: transform 0.2s;
    }
    .line-claim-btn:hover { transform: scale(1.03); background: #b30000; }

    .empty-card { 
      background: #141416; 
      border: 1px solid #3f3f46; 
      border-radius: 12px; 
      padding: 26px 20px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center; 
    }
    .empty-btn { 
      background: #3f3f46; 
      color: #a1a1aa; 
      padding: 10px 18px; 
      border-radius: 6px; 
      display: block; 
      margin-top: 15px; 
      font-weight: 700; 
      font-size: 14px; 
    }

    @keyframes popIn { 0% { transform: scale(0.65); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- เลเยอร์สีเลือดที่จะวาบขึ้นมาตอนกด -->
  <div id="bloodFlash" class="blood-flash"></div>

  <!-- คอนเทนเนอร์หลัก -->
  <div class="spooky-container" id="giftBox" onclick="handleBoxClick()">
    
    <div class="folder-wrap" id="boxIcon">
      <!-- ดึงรูปแฟ้มหมายเลข 27 มาแสดง -->
      <img src="folder27.jpg" alt="แฟ้มคดี 27" class="folder-image">
    </div>
    
    <div class="spooky-hint" id="statusHint">🩸 เปิดแฟ้มคดี (สุ่ม 10 สิทธิ์)</div>
  </div>

  <!-- ป๊อปอัปผลรางวัล -->
  <div class="popup-overlay" id="popupSuccess">
    <div class="popup-card">
      <div class="popup-title">แฟ้มถูกเปิดออก!</div>
      <div class="reward-box">
        <div class="reward-name" id="prizeDisplay">กำลังค้นหาข้อมูล...</div>
      </div>
      <div class="capture-note">📸 แคปหน้าจอนี้ไว้เป็นหลักฐานทันที</div>
      <p>แตะปุ่มด้านล่างเพื่อส่งหลักฐานยืนยันเข้า LINE OA CAH</p>
      <a href="#" id="lineSendBtn" target="_blank" class="line-claim-btn">
        ส่งข้อความยืนยันรับรางวัล ➔
      </a>
    </div>
  </div>

  <!-- ป๊อปอัปเมื่อสิทธิ์เต็ม 10 คนแล้ว -->
  <div class="popup-overlay" id="popupEmpty">
    <div class="empty-card">
      <div style="font-size: 42px; margin-bottom: 4px;">💀</div>
      <h2 style="color: #f87171; font-size: 18px; margin-bottom: 8px;">แฟ้มว่างเปล่า...</h2>
      <p style="font-size: 13px; color: #a1a1aa;">ผู้รอดชีวิต 10 คนแรกคว้าข้อมูลในแฟ้มไปหมดแล้วค่ะ</p>
      <div class="empty-btn">โควตาหมดสิ้นแล้ว</div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwixVC8r8-ihKMQt5IDSCRTEc2pFmPFxIKs6hLVJG5ite84J03DDRk1eC2QC7cO76WL/exec";
    const lineAccountID = "707nyqrq";
    let isProcessing = false;

    function hasPlayed() {
      try { return localStorage.getItem("cahOutingPlayed") === "true"; } 
      catch (e) { return false; }
    }
    function setPlayedFlag() {
      try { localStorage.setItem("cahOutingPlayed", "true"); } 
      catch (e) { console.warn("Local storage blocked"); }
    }

    window.onload = function() {
      if (hasPlayed()) {
        document.getElementById('statusHint').innerText = "🚫 สิทธิ์ของเครื่องนี้ถูกใช้ไปแล้ว";
        document.getElementById('boxIcon').style.filter = "grayscale(100%) opacity(0.5)";
      }
    };

    function playTerrifyingHorrorSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(110, ctx.currentTime);
        subOsc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 1.2);
        subGain.gain.setValueAtTime(0.7, ctx.currentTime);
        subGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start();
        subOsc.stop(ctx.currentTime + 1.2);

        const screechOsc = ctx.createOscillator();
        const screechGain = ctx.createGain();
        screechOsc.type = 'triangle';
        screechOsc.frequency.setValueAtTime(850, ctx.currentTime);
        screechOsc.frequency.linearRampToValueAtTime(1400, ctx.currentTime + 0.3);
        screechOsc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 1.1);
        screechGain.gain.setValueAtTime(0.4, ctx.currentTime);
        screechGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.1);
        screechOsc.connect(screechGain);
        screechGain.connect(ctx.destination);
        screechOsc.start();
        screechOsc.stop(ctx.currentTime + 1.1);
      } catch (err) { }
    }

    // ฟังก์ชันสร้างเอฟเฟกต์เลือดพุ่งสาดกระจาย
    function shootBloodSplatter() {
      const duration = 2500;
      const animationEnd = Date.now() + duration;
      
      // ตั้งค่า Confetti ให้ดูเหมือนหยดเลือดขนาดใหญ่ตกลงมาอย่างรวดเร็ว
      const defaults = { 
        startVelocity: 40, 
        spread: 360, 
        ticks: 80, 
        zIndex: 9999,
        colors: ['#8a0303', '#cc0000', '#5e0000', '#ff0000'],
        shapes: ['circle'],
        gravity: 2,
        scalar: 1.5
      };

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 60 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: Math.random(), y: Math.random() - 0.2 }
        }));
      }, 200);
    }

    async function handleBoxClick() {
      if (hasPlayed()) {
        alert("คุณได้เปิดแฟ้มคดีของเครื่องนี้ไปแล้วค่ะ (จำกัด 1 เครื่อง / 1 สิทธิ์)");
        return;
      }
      if (isProcessing) return;
      isProcessing = true;

      playTerrifyingHorrorSound();

      const box = document.getElementById('boxIcon');
      const hint = document.getElementById('statusHint');
      const bloodFlash = document.getElementById('bloodFlash');
      
      hint.innerText = "กำลังแกะรอยข้อมูล...";

      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();

        if (result.status === "SUCCESS") {
          // ซ่อนแฟ้ม
          box.style.display = 'none';
          
          // สั่งให้หน้าจอวาบสีเลือด
          bloodFlash.classList.add('flash-active');
          setTimeout(() => {
            bloodFlash.classList.remove('flash-active');
            bloodFlash.classList.add('flash-fade');
          }, 150);
          
          // สาดหยดเลือด
          shootBloodSplatter();
          
          setPlayedFlag();
          document.getElementById('prizeDisplay').innerText = result.prize;

          const msg = encodeURIComponent(`สวัสดีค่ะ/ครับ ฉันเปิดแฟ้มได้รางวัล "${result.prize}" (เวลา ${result.time}) ขอรับสิทธิ์ค่ะ/ครับ`);
          document.getElementById('lineSendBtn').href = `https://line.me/R/oaMessage/%40${lineAccountID}/?${msg}`;

          // หน่วงเวลาให้เห็นเลือดสาดก่อนป๊อปอัปขึ้น
          setTimeout(() => {
            document.getElementById('popupSuccess').style.display = 'flex';
          }, 900);

        } else {
          document.getElementById('popupEmpty').style.display = 'flex';
        }
      } catch (err) {
        alert("สัญญาณขาดหาย กรุณาลองใหม่อีกครั้งค่ะ");
        isProcessing = false;
        hint.innerText = "🩸 เปิดแฟ้มคดี (สุ่ม 10 สิทธิ์)";
      }
    }
  </script>

</body>
</html>
