<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', -apple-system, sans-serif; }
    
    /* พื้นหลังสีดำสนิท แสงหมอกสีส้มเลือด */
    body { 
      background: radial-gradient(circle at 50% 60%, #290808 0%, #0d0303 50%, #000000 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
      position: relative;
    }

    /* คอนเทนเนอร์หลัก */
    .spooky-container { 
      text-align: center; 
      cursor: pointer; 
      user-select: none; 
      position: relative;
      z-index: 10;
      padding: 20px;
    }

    /* =========================================
       ของตกแต่งฮาโลวีนข้างไหผี (ฟักทอง, หัวกะโหลก, ค้างคาว)
       ========================================= */
    .decor-prop {
      position: absolute;
      font-size: 42px;
      pointer-events: none;
      filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.8));
      animation: spookyFloat 3s infinite ease-in-out alternate;
    }
    .prop-left {
      bottom: 25px;
      left: -35px;
      transform: rotate(-15deg);
      animation-delay: 0.2s;
    }
    .prop-right {
      bottom: 25px;
      right: -35px;
      transform: rotate(15deg);
      animation-delay: 0.8s;
    }

    .decor-bat {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
      animation: batHover 2s infinite ease-in-out alternate;
    }
    .bat-left {
      top: -5px;
      left: -20px;
      transform: rotate(-20deg);
      animation-delay: 0.5s;
    }
    .bat-right {
      top: 15px;
      right: -25px;
      transform: rotate(20deg) scaleX(-1); /* กลับด้านค้างคาว */
      animation-delay: 1.2s;
    }

    @keyframes batHover {
      0% { transform: translateY(0) rotate(-15deg); }
      100% { transform: translateY(-12px) rotate(-5deg); }
    }

    /* =========================================
       ไหแม่นาค
       ========================================= */
    .pot-svg-wrap {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      animation: spookyFloat 2.6s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.7)) drop-shadow(0 0 45px rgba(255, 80, 0, 0.5));
      transition: transform 0.2s, filter 0.2s;
      position: relative;
      z-index: 5;
    }
    .spooky-container:hover .pot-svg-wrap {
      transform: scale(1.1) rotate(-3deg);
      filter: drop-shadow(0 0 30px rgba(255, 30, 0, 0.95)) drop-shadow(0 0 60px rgba(255, 120, 0, 0.8));
    }

    .glow-text {
      font-family: 'Prompt', sans-serif;
      font-weight: 900;
      font-size: 32px;
      fill: #ffcc00;
      filter: drop-shadow(0 0 10px #ff2a00);
      animation: flickerLight 0.2s infinite alternate;
    }
    @keyframes flickerLight {
      0% { opacity: 0.85; filter: drop-shadow(0 0 6px #ff2a00); }
      100% { opacity: 1; filter: drop-shadow(0 0 18px #ffaa00); }
    }

    .spooky-hint { 
      margin-top: 15px; 
      background: #0f0202; 
      color: #ff5252; 
      font-size: 14px; 
      font-weight: 700; 
      padding: 8px 24px; 
      border-radius: 30px; 
      display: inline-block; 
      border: 1.5px solid #b71c1c;
      box-shadow: 0 0 18px rgba(220, 38, 38, 0.5); 
      letter-spacing: 0.5px;
      position: relative;
      z-index: 5;
    }

    .spooky-explode { 
      animation: demonBurst 0.55s forwards ease-out !important; 
    }
    @keyframes spookyFloat { 
      0%, 100% { transform: translateY(0) rotate(0deg); } 
      50% { transform: translateY(-12px) rotate(3deg); } 
    }
    @keyframes demonBurst {
      0% { transform: scale(1); filter: brightness(1.5); }
      35% { transform: scale(1.4) rotate(12deg); filter: brightness(3) drop-shadow(0 0 40px red); }
      100% { transform: scale(0); opacity: 0; filter: blur(14px); }
    }

    /* ป๊อปอัปผลรางวัล */
    .popup-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.94); 
      backdrop-filter: blur(8px); 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .popup-card { 
      background: #0f0b12; 
      border: 1.5px solid #ff4500; 
      border-radius: 20px; 
      padding: 26px 20px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center; 
      box-shadow: 0 0 45px rgba(255, 0, 0, 0.4); 
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .popup-title {
      font-size: 19px;
      font-weight: 700;
      color: #ffaa5a;
      text-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
      margin-bottom: 6px;
    }
    .reward-box { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1.5px dashed #ff4500; 
      padding: 12px; 
      border-radius: 12px; 
      margin: 14px 0; 
    }
    .reward-name { 
      font-size: 16px; 
      font-weight: 700; 
      color: #38bdf8; 
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .capture-note { 
      font-size: 12px; 
      color: #fca5a5; 
      font-weight: 600; 
      background: rgba(220, 38, 38, 0.25); 
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 7px; 
      border-radius: 8px; 
      margin-bottom: 14px; 
    }
    .popup-card p { 
      font-size: 13px; 
      color: #cbd5e1; 
      margin-bottom: 16px; 
      line-height: 1.4; 
    }
    .line-claim-btn { 
      display: block; 
      background: #06c755; 
      color: #fff; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 700; 
      padding: 11px 18px; 
      border-radius: 25px; 
      box-shadow: 0 0 20px rgba(6, 199, 85, 0.5); 
      transition: transform 0.2s;
    }
    .line-claim-btn:hover { transform: scale(1.03); }

    .empty-card { 
      background: #141416; 
      border: 1px solid #3f3f46; 
      border-radius: 20px; 
      padding: 26px 20px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center; 
    }
    .empty-btn { 
      background: #3f3f46; 
      color: #a1a1aa; 
      padding: 10px 18px; 
      border-radius: 25px; 
      display: block; 
      margin-top: 15px; 
      font-weight: 700; 
      font-size: 14px; 
    }

    @keyframes popIn { 0% { transform: scale(0.65); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- คอนเทนเนอร์หลัก ไหแม่นาค + ของตกแต่ง -->
  <div class="spooky-container" id="giftBox" onclick="handleBoxClick()">
    
    <!-- ของตกแต่งฮาโลวีนด้านข้าง -->
    <div class="decor-prop prop-left">🎃</div>
    <div class="decor-prop prop-right">💀</div>
    <div class="decor-bat bat-left">🦇</div>
    <div class="decor-bat bat-right">🦇</div>

    <!-- ไหแม่นาค 27 -->
    <div class="pot-svg-wrap" id="boxIcon">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <!-- ตัวไหดินเผา -->
        <path d="M35 25 C20 30, 10 50, 15 75 C20 95, 80 95, 85 75 C90 50, 80 30, 65 25 Z" fill="#4a2715" />
        <path d="M35 25 C20 30, 10 50, 15 75 C25 85, 40 85, 50 85 C35 70, 35 40, 50 25 C45 25, 40 25, 35 25 Z" fill="#2d1509" />
        <!-- ผ้าแดงยันต์ปิดปากไห -->
        <path d="M28 22 C35 12, 65 12, 72 22 C80 29, 65 37, 50 37 C35 37, 20 29, 28 22 Z" fill="#8a0303" />
        <path d="M28 22 Q50 32 72 22" stroke="#ff3333" stroke-width="2" fill="none"/>
        <path d="M28 25 Q35 42 42 35" stroke="#520000" stroke-width="2" fill="none"/>
        <path d="M72 25 Q65 42 58 35" stroke="#520000" stroke-width="2" fill="none"/>
        <!-- สายสิญจน์พันผ้าแดง -->
        <path d="M25 27 Q50 36 75 27" stroke="#f2e2be" stroke-width="2" fill="none" />
        <path d="M28 30 Q50 39 72 30" stroke="#f2e2be" stroke-width="2" fill="none" />
        <!-- อักขระยันต์จางๆ บนไห -->
        <path d="M25 55 Q30 50 35 60 Q40 55 45 65" stroke="#8a0303" stroke-width="1.5" fill="none" opacity="0.6" />
        <path d="M75 55 Q70 50 65 60 Q60 55 55 65" stroke="#8a0303" stroke-width="1.5" fill="none" opacity="0.6" />
        <!-- เลข 27 อาถรรพ์ตรงกลางไห -->
        <text x="50" y="68" class="glow-text" text-anchor="middle">27</text>
      </svg>
    </div>
    
    <div class="spooky-hint" id="statusHint">🩸 เปิดไหแม่นาค (สุ่ม 10 สิทธิ์)</div>
  </div>

  <!-- ป๊อปอัปผลรางวัล -->
  <div class="popup-overlay" id="popupSuccess">
    <div class="popup-card">
      <div style="font-size: 42px; margin-bottom: 4px;">👻</div>
      <div class="popup-title">วิญญาณให้โชค!</div>
      <div class="reward-box">
        <div class="reward-name" id="prizeDisplay">กำลังดึงของรางวัล...</div>
      </div>
      <div class="capture-note">📸 แคปหน้าจอนี้ไว้เป็นยันต์กันผี (หลักฐาน)</div>
      <p>แตะปุ่มด้านล่างเพื่อส่งหลักฐานยืนยันเข้า LINE OA CAH</p>
      <a href="#" id="lineSendBtn" target="_blank" class="line-claim-btn">
        ส่งข้อความยืนยันรับรางวัล ➔
      </a>
    </div>
  </div>

  <!-- ป๊อปอัปเมื่อสิทธิ์เต็ม 10 คนแล้ว -->
  <div class="popup-overlay" id="popupEmpty">
    <div class="empty-card">
      <div style="font-size: 42px; margin-bottom: 4px;">💀</div>
      <h2 style="color: #f87171; font-size: 18px; margin-bottom: 8px;">ไหว่างเปล่า...</h2>
      <p style="font-size: 13px; color: #a1a1aa;">ผู้รอดชีวิต 10 คนแรกดึงของรางวัลในไหไปหมดแล้วค่ะ</p>
      <div class="empty-btn">โควตาหมดสิ้นแล้ว</div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwixVC8r8-ihKMQt5IDSCRTEc2pFmPFxIKs6hLVJG5ite84J03DDRk1eC2QC7cO76WL/exec";
    const lineAccountID = "707nyqrq";

    let isProcessing = false;

    // ระบบสร้างเสียงสยองขวัญสังเคราะห์โดยตรง
    function playTerrifyingHorrorSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(110, ctx.currentTime);
        subOsc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 1.2);
        subGain.gain.setValueAtTime(0.7, ctx.currentTime);
        subGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start();
        subOsc.stop(ctx.currentTime + 1.2);

        const screechOsc = ctx.createOscillator();
        const screechGain = ctx.createGain();
        screechOsc.type = 'triangle';
        screechOsc.frequency.setValueAtTime(850, ctx.currentTime);
        screechOsc.frequency.linearRampToValueAtTime(1400, ctx.currentTime + 0.3);
        screechOsc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 1.1);
        screechGain.gain.setValueAtTime(0.4, ctx.currentTime);
        screechGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.1);
        screechOsc.connect(screechGain);
        screechGain.connect(ctx.destination);
        screechOsc.start();
        screechOsc.stop(ctx.currentTime + 1.1);
      } catch (err) {
        console.error("Audio synth error", err);
      }
    }

    async function handleBoxClick() {
      if (isProcessing) return;
      isProcessing = true;

      playTerrifyingHorrorSound();

      const box = document.getElementById('boxIcon');
      const hint = document.getElementById('statusHint');
      hint.innerText = "กำลังเปิดไหอาถรรพ์...";

      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();

        if (result.status === "SUCCESS") {
          box.classList.add('spooky-explode');
          
          confetti({ 
            particleCount: 130, 
            spread: 80, 
            origin: { y: 0.6 },
            colors: ['#cc0000', '#ffd700', '#000000', '#8a0303']
          });

          document.getElementById('prizeDisplay').innerText = result.prize;

          const msg = encodeURIComponent(`สวัสดีค่ะ/ครับ ฉันเปิดไหได้รางวัล "${result.prize}" (เวลา ${result.time}) ขอรับสิทธิ์ค่ะ/ครับ`);
          document.getElementById('lineSendBtn').href = `https://line.me/R/oaMessage/%40${lineAccountID}/?${msg}`;

          setTimeout(() => {
            document.getElementById('popupSuccess').style.display = 'flex';
          }, 400);

        } else {
          document.getElementById('popupEmpty').style.display = 'flex';
        }
      } catch (err) {
        alert("สัญญาณขาดหาย กรุณาลองใหม่อีกครั้งค่ะ");
        isProcessing = false;
        hint.innerText = "🩸 เปิดไหแม่นาค (สุ่ม 10 สิทธิ์)";
      }
    }
  </script>

</body>
</html>
