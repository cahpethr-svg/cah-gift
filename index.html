<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Prompt:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', -apple-system, sans-serif; }
    
    /* พื้นหลังสีดำสนิท กลืนกับขอบรูป */
    body { 
      background: #000000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
      position: relative;
    }

    .spooky-container { 
      text-align: center; 
      cursor: pointer; 
      user-select: none; 
      position: relative;
      z-index: 10;
      padding: 20px;
    }

    /* =========================================
       รูปภาพป้ายอาถรรพ์ (ใส่แอนิเมชันให้ขยับได้)
       ========================================= */
    .bloody-text-wrap {
      width: 320px; /* ขนาดความกว้างรูปภาพ */
      max-width: 85vw;
      margin: 0 auto;
      /* แอนิเมชันลอยและหายใจ */
      animation: floatBreathe 3s infinite ease-in-out;
      transition: transform 0.2s, filter 0.2s;
    }
    
    .bloody-image {
      width: 100%;
      height: auto;
      border-radius: 12px; /* ลบมุมภาพให้มนเล็กน้อยให้กลืนกับฉาก */
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.15); /* แสงแดงสะท้อนจางๆ รอบรูป */
    }

    /* เวลาเอาเมาส์ชี้ รูปจะขยายตัวและเอียงเล็กน้อย พร้อมแสงแดงสว่างขึ้น */
    .spooky-container:hover .bloody-text-wrap {
      transform: scale(1.08) rotate(-2deg);
      filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.9));
    }

    /* จังหวะการขยับและเปล่งแสงของรูปภาพ */
    @keyframes floatBreathe {
      0%, 100% { transform: translateY(0) scale(1); filter: brightness(1) drop-shadow(0 0 10px rgba(255, 0, 0, 0.4)); }
      50% { transform: translateY(-10px) scale(1.02); filter: brightness(1.25) drop-shadow(0 0 35px rgba(255, 0, 0, 0.85)); }
    }

    .spooky-hint { 
      margin-top: 25px; 
      background: #0f0202; 
      color: #ff5252; 
      font-size: 14px; 
      font-weight: 700; 
      padding: 8px 24px; 
      border-radius: 30px; 
      display: inline-block; 
      border: 1.5px solid #b71c1c;
      box-shadow: 0 0 18px rgba(220, 38, 38, 0.5); 
      letter-spacing: 0.5px;
      position: relative;
      z-index: 5;
    }

    /* จังหวะระเบิดเมื่อกดจิ้มรูป */
    .spooky-explode { 
      animation: demonBurst 0.55s forwards ease-out !important; 
    }
    @keyframes demonBurst {
      0% { transform: scale(1); filter: brightness(1.5); }
      35% { transform: scale(1.4) rotate(12deg); filter: brightness(3) drop-shadow(0 0 40px red); }
      100% { transform: scale(0); opacity: 0; filter: blur(14px); }
    }

    /* =========================================
       ป๊อปอัปผลรางวัล
       ========================================= */
    .popup-overlay { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.94); 
      backdrop-filter: blur(8px); 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .popup-card { 
      background: #0f0b12; 
      border: 1.5px solid #ff4500; 
      border-radius: 20px; 
      padding: 26px 20px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center; 
      box-shadow: 0 0 45px rgba(255, 0, 0, 0.4); 
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }
    .popup-title {
      font-size: 19px;
      font-weight: 700;
      color: #ffaa5a;
      text-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
      margin-bottom: 6px;
    }
    .reward-box { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1.5px dashed #ff4500; 
      padding: 12px; 
      border-radius: 12px; 
      margin: 14px 0; 
    }
    .reward-name { 
      font-size: 16px; 
      font-weight: 700; 
      color: #38bdf8; 
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }
    .capture-note { 
      font-size: 12px; 
      color: #fca5a5; 
      font-weight: 600; 
      background: rgba(220, 38, 38, 0.25); 
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 7px; 
      border-radius: 8px; 
      margin-bottom: 14px; 
    }
    .popup-card p { 
      font-size: 13px; 
      color: #cbd5e1; 
      margin-bottom: 16px; 
      line-height: 1.4; 
    }
    .line-claim-btn { 
      display: block; 
      background: #06c755; 
      color: #fff; 
      text-decoration: none; 
      font-size: 14px; 
      font-weight: 700; 
      padding: 11px 18px; 
      border-radius: 25px; 
      box-shadow: 0 0 20px rgba(6, 199, 85, 0.5); 
      transition: transform 0.2s;
    }
    .line-claim-btn:hover { transform: scale(1.03); }

    .empty-card { 
      background: #141416; 
      border: 1px solid #3f3f46; 
      border-radius: 20px; 
      padding: 26px 20px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center; 
    }
    .empty-btn { 
      background: #3f3f46; 
      color: #a1a1aa; 
      padding: 10px 18px; 
      border-radius: 25px; 
      display: block; 
      margin-top: 15px; 
      font-weight: 700; 
      font-size: 14px; 
    }

    @keyframes popIn { 0% { transform: scale(0.65); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- คอนเทนเนอร์หลัก -->
  <div class="spooky-container" id="giftBox" onclick="handleBoxClick()">
    
    <!-- ดึงรูปภาพ outing2026.png มาแสดง และใส่คลาสให้รูปขยับได้ -->
    <div class="bloody-text-wrap" id="boxIcon">
      <img src="outing2026.png" alt="เจริญสุข Outing 2026" class="bloody-image">
    </div>
    
    <div class="spooky-hint" id="statusHint">🩸 จิ้มเพื่อปลดผนึก (สุ่ม 10 สิทธิ์)</div>
  </div>

  <!-- ป๊อปอัปผลรางวัล -->
  <div class="popup-overlay" id="popupSuccess">
    <div class="popup-card">
      <div style="font-size: 42px; margin-bottom: 4px;">👻</div>
      <div class="popup-title">วิญญาณให้โชค!</div>
      <div class="reward-box">
        <div class="reward-name" id="prizeDisplay">กำลังดึงของรางวัล...</div>
      </div>
      <div class="capture-note">📸 แคปหน้าจอนี้ไว้เป็นยันต์กันผี (หลักฐาน)</div>
      <p>แตะปุ่มด้านล่างเพื่อส่งหลักฐานยืนยันเข้า LINE OA CAH</p>
      <a href="#" id="lineSendBtn" target="_blank" class="line-claim-btn">
        ส่งข้อความยืนยันรับรางวัล ➔
      </a>
    </div>
  </div>

  <!-- ป๊อปอัปเมื่อสิทธิ์เต็ม 10 คนแล้ว -->
  <div class="popup-overlay" id="popupEmpty">
    <div class="empty-card">
      <div style="font-size: 42px; margin-bottom: 4px;">💀</div>
      <h2 style="color: #f87171; font-size: 18px; margin-bottom: 8px;">สิทธิ์ถูกกลืนกิน...</h2>
      <p style="font-size: 13px; color: #a1a1aa;">ผู้รอดชีวิต 10 คนแรกดึงของรางวัลไปหมดแล้วค่ะ</p>
      <div class="empty-btn">โควตาหมดสิ้นแล้ว</div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwixVC8r8-ihKMQt5IDSCRTEc2pFmPFxIKs6hLVJG5ite84J03DDRk1eC2QC7cO76WL/exec";
    const lineAccountID = "707nyqrq";

    let isProcessing = false;

    // เสียงสยองขวัญสังเคราะห์
    function playTerrifyingHorrorSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(110, ctx.currentTime);
        subOsc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 1.2);
        subGain.gain.setValueAtTime(0.7, ctx.currentTime);
        subGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);
        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start();
        subOsc.stop(ctx.currentTime + 1.2);

        const screechOsc = ctx.createOscillator();
        const screechGain = ctx.createGain();
        screechOsc.type = 'triangle';
        screechOsc.frequency.setValueAtTime(850, ctx.currentTime);
        screechOsc.frequency.linearRampToValueAtTime(1400, ctx.currentTime + 0.3);
        screechOsc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 1.1);
        screechGain.gain.setValueAtTime(0.4, ctx.currentTime);
        screechGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.1);
        screechOsc.connect(screechGain);
        screechGain.connect(ctx.destination);
        screechOsc.start();
        screechOsc.stop(ctx.currentTime + 1.1);
      } catch (err) {
        console.error("Audio synth error", err);
      }
    }

    // ฟังก์ชันยิงพลุอลังการ (ต่อเนื่อง 3 วินาที)
    function shootGrandConfetti() {
      const duration = 3000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 },
          colors: ['#cc0000', '#ff0000', '#000000', '#8a0303']
        }));
      }, 250);
    }

    async function handleBoxClick() {
      if (isProcessing) return;
      isProcessing = true;

      playTerrifyingHorrorSound();

      const box = document.getElementById('boxIcon');
      const hint = document.getElementById('statusHint');
      hint.innerText = "กำลังปลดผนึกอาถรรพ์...";

      try {
        const response = await fetch(GAS_API_URL);
        const result = await response.json();

        if (result.status === "SUCCESS") {
          box.classList.add('spooky-explode');
          
          // เรียกใช้ฟังก์ชันพลุอลังการ
          shootGrandConfetti();

          document.getElementById('prizeDisplay').innerText = result.prize;

          const msg = encodeURIComponent(`สวัสดีค่ะ/ครับ ฉันสุ่มได้รางวัล "${result.prize}" (เวลา ${result.time}) ขอรับสิทธิ์ค่ะ/ครับ`);
          document.getElementById('lineSendBtn').href = `https://line.me/R/oaMessage/%40${lineAccountID}/?${msg}`;

          // หน่วงเวลาเปิดป๊อปอัปนิดนึง ให้ดูพลุแตกก่อน
          setTimeout(() => {
            document.getElementById('popupSuccess').style.display = 'flex';
          }, 800);

        } else {
          document.getElementById('popupEmpty').style.display = 'flex';
        }
      } catch (err) {
        alert("สัญญาณขาดหาย กรุณาลองใหม่อีกครั้งค่ะ");
        isProcessing = false;
        hint.innerText = "🩸 จิ้มเพื่อปลดผนึก (สุ่ม 10 สิทธิ์)";
      }
    }
  </script>

</body>
</html>
